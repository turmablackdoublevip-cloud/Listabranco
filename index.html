<!DOCTYPE html>  
<html lang="pt-BR">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Painel de Análise - Turma Black</title>  
    <script src="https://cdn.tailwindcss.com"></script>  
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">  
    <style>  
        body {  
            font-family: 'Inter', sans-serif;  
            background-color: #000000;  
            color: #e5e5e5;  
        }  
        .bg-graphite { background-color: #1a1a1a; }  
        .bg-graphite-dark { background-color: #111111; }  
        .border-neon-red { border-color: #ff003c; }  
        .text-neon-red { color: #ff003c; }  
        .bg-neon-red { background-color: #ff003c; }  
          
        .neon-glow {  
            box-shadow: 0 0 10px rgba(255, 0, 60, 0.2), inset 0 0 5px rgba(255, 0, 60, 0.1);  
        }  
        .font-digital {  
            font-family: 'Share Tech Mono', monospace;  
        }  
    </style>  
</head>  
<body class="p-6 min-h-screen flex flex-col items-center justify-start gap-6">  
  
    <header class="w-full max-w-4xl flex justify-between items-center border-b border-neon-red pb-4 mb-2">  
        <div>  
            <h1 class="text-2xl font-bold tracking-wider text-neon-red uppercase">Turma Black</h1>  
            <p class="text-xs text-gray-500 uppercase tracking-widest">Painel Inteligente Automático</p>  
        </div>  
        <div class="flex items-center gap-4 text-right">  
            <div id="relogioDigital" class="font-digital text-xl text-emerald-400 tracking-widest bg-zinc-950 px-3 py-1 rounded border border-emerald-950">  
                00:00:00  
            </div>  
            <span class="text-xs bg-neon-red text-white font-bold px-4 py-1.5 rounded-full uppercase tracking-wider neon-glow">SINAIS DE BRANCO</span>  
        </div>  
    </header>  
  
    <main class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-3 gap-6">  
          
        <section class="bg-graphite border border-neon-red rounded-xl p-5 neon-glow flex flex-col gap-4 md:col-span-1">  
            <h2 class="text-sm font-semibold uppercase tracking-wider text-neon-red border-b border-zinc-800 pb-2">Gerador de Sinal</h2>  
              
            <div class="flex flex-col gap-3">  
                <div>  
                    <label class="text-xs text-gray-400 block mb-1">Minuto Exato:</label>  
                    <input type="number" id="minExato" min="0" max="59" class="w-full bg-black border border-zinc-700 rounded p-2 text-white focus:outline-none focus:border-neon-red transition" placeholder="Ex: 10" oninput="sincronizarPuxadorAntes()">  
                </div>  
                <div>  
                    <label class="text-xs text-gray-400 block mb-1">Pedra de Antes (Número):</label>  
                    <input type="number" id="pedraAntes" min="0" max="14" class="w-full bg-black border border-zinc-700 rounded p-2 text-white focus:outline-none focus:border-neon-red transition" placeholder="Ex: 7">  
                </div>  
                <div>  
                    <label class="text-xs text-gray-400 block mb-1">Pedra de Depois (Número):</label>  
                    <input type="number" id="pedraDepois" min="0" max="14" class="w-full bg-black border border-zinc-700 rounded p-2 text-white focus:outline-none focus:border-neon-red transition" placeholder="Ex: 2">  
                </div>  
            </div>  
  
            <button onclick="calcularESalvarSinal()" class="w-full bg-neon-red hover:bg-opacity-90 text-white font-bold py-2.5 rounded transition duration-200 uppercase text-xs tracking-wider mt-2 neon-glow">  
                Calcular e Registrar  
            </button>  
        </section>  
  
        <section class="bg-graphite border border-neon-red rounded-xl p-5 neon-glow flex flex-col gap-4 md:col-span-2">  
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">  
                <h2 class="text-sm font-semibold uppercase tracking-wider text-neon-red">Sinais de Branco (Planilha)</h2>  
                <button onclick="resetGeral()" class="text-[10px] bg-zinc-900 border border-zinc-700 hover:bg-red-950 hover:text-white px-2 py-1 rounded uppercase tracking-wider text-gray-400 transition">  
                    ⚠️ Reset Total Memória  
                </button>  
            </div>  
              
            <div class="bg-black border border-zinc-900 rounded p-2 min-h-[210px] max-h-[250px] overflow-y-auto flex flex-col gap-2" id="listaSinais">  
                <div class="text-gray-600 text-sm italic text-center py-8">Nenhum sinal calculado ainda...</div>  
            </div>  
        </section>  
  
        <section class="bg-graphite border border-neon-red rounded-xl p-5 neon-glow flex flex-col gap-4 md:col-span-1">  
            <h2 class="text-sm font-semibold uppercase tracking-wider text-neon-red border-b border-zinc-800 pb-2">Registrar Puxador</h2>  
              
            <div class="flex flex-col gap-2">  
                <div>  
                    <label class="text-xs text-gray-400 block mb-1">Minuto do Puxador:</label>  
                    <input type="number" id="minPuxadorManual" min="0" max="59" class="w-full bg-black border border-zinc-700 rounded p-2 text-white focus:outline-none focus:border-neon-red transition" placeholder="Ex: 09">  
                </div>  
                <div>  
                    <label class="text-xs text-gray-400 block mb-1">Número do Puxador:</label>  
                    <input type="number" id="inputPuxadorManual" min="0" max="14" class="w-full bg-black border border-zinc-700 rounded p-2 text-white focus:outline-none focus:border-neon-red transition" placeholder="Ex: 11">  
                </div>  
            </div>  
  
            <button onclick="registrarPuxadorManual()" class="w-full bg-zinc-900 hover:bg-zinc-800 text-neon-red border border-neon-red border-opacity-40 font-bold py-2 rounded transition duration-200 uppercase text-xs tracking-wider">  
                Registrar Puxador  
            </button>  
        </section>  
  
        <section class="bg-graphite border border-neon-red rounded-xl p-5 neon-glow flex flex-col gap-4 md:col-span-2">  
            <h2 class="text-sm font-semibold uppercase tracking-wider text-neon-red border-b border-zinc-800 pb-2">Puxadores (Mais de 2 Repetições)</h2>  
              
            <div class="flex flex-wrap gap-4 justify-start items-center" id="containerPuxadores">  
                <div class="text-gray-600 text-sm italic py-4">Nenhum número repetiu mais de 2 vezes ainda.</div>  
            </div>  
        </section>  
  
    </main>  
  
    <script>  
        // Memória persistente com LocalStorage  
        let sinaisNaPlanilha = JSON.parse(localStorage.getItem('sinaisNaPlanilha')) || [];   
        let historicoPuxadores = JSON.parse(localStorage.getItem('historicoPuxadores')) || []; // Lista de objetos { numero, timestamp, minuto }  
        let ultimaHoraRegistrada = localStorage.getItem('ultimaHoraRegistrada') || new Date().getHours();  
  
        // Inicializa o app  
        renderSinais();  
        renderPuxadores();  
  
        // 1. Atualizar automaticamente o minuto anterior da contagem do puxador  
        function sincronizarPuxadorAntes() {  
            const minExato = document.getElementById('minExato').value;  
            if (minExato !== '') {  
                let minutoAntes = (parseInt(minExato) - 1 + 60) % 60;  
                document.getElementById('minPuxadorManual').value = minutoAntes;  
            }  
        }  
  
        // Relógio de Tempo Real & Sistema de Monitoramento de Alertas Visual (1m antes, exato, 1m depois)  
        setInterval(() => {  
            let agora = new Date();  
            let h = agora.getHours();  
            let m = agora.getMinutes();  
            let s = agora.getSeconds();  
              
            document.getElementById('relogioDigital').innerText =   
                `${h < 10 ? '0'+h : h}:${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;  
  
            // Executa verificações temporais automáticas  
            verificarViradaDeHora(h);  
            verificarLimpezaPuxadores(agora.getTime());  
            renderSinais(); // Atualiza cores dinâmicas a cada segundo  
        }, 1000);  
  
        // 7. Apagar histórico de RED a cada virada de hora mantendo GREEN  
        function verificarViradaDeHora(horaAtual) {  
            if (parseInt(ultimaHoraRegistrada) !== horaAtual) {  
                sinaisNaPlanilha = sinaisNaPlanilha.filter(s => s.status !== 'RED');  
                ultimaHoraRegistrada = horaAtual;  
                salvarDados();  
            }  
        }  
  
        // 7. Após 3 horas apagar o puxador colocado (3h = 10800000ms)  
        function verificarLimpezaPuxadores(timestampAtual) {  
            let tamanhoAntes = historicoPuxadores.length;  
            historicoPuxadores = historicoPuxadores.filter(p => (timestampAtual - p.timestamp) < 10800000);  
            if(historicoPuxadores.length !== tamanhoAntes) {  
                salvarDados();  
                renderPuxadores();  
            }  
        }  
  
        // --- LÓGICA DE SINAIS DE BRANCO ---  
        function calcularESalvarSinal() {  
            const minExato = document.getElementById('minExato').value;  
            const pedraAntes = document.getElementById('pedraAntes').value;  
            const pedraDepois = document.getElementById('pedraDepois').value;  
  
            if (minExato === '' || pedraAntes === '' || pedraDepois === '') {  
                alert('Por favor, preencha o minuto e as duas pedras.');  
                return;  
            }  
  
            let agora = new Date();  
            let horaAtual = agora.getHours();  
            let minutoAtual = agora.getMinutes();  
  
            let minutoResultado = parseInt(minExato) + parseInt(pedraAntes) + parseInt(pedraDepois);  
  
            // 2. Sempre que a soma passar do horário atual, já avança para a próxima hora  
            if (minutoResultado >= 60) {  
                let horasAdicionais = Math.floor(minutoResultado / 60);  
                minutoResultado = minutoResultado % 60;  
                horaAtual = (horaAtual + horasAdicionais) % 24;  
            } else if (minutoResultado < minutoAtual) {  
                // Se o minuto calculado ficou atrás do minuto de agora na mesma hora, pula pra próxima hora  
                horaAtual = (horaAtual + 1) % 24;  
            }  
  
            adicionarSinalComOrdenacao(horaAtual, minutoResultado, 0);  
  
            // Reseta inputs  
            document.getElementById('minExato').value = '';  
            document.getElementById('pedraAntes').value = '';  
            document.getElementById('pedraDepois').value = '';  
            document.getElementById('minPuxadorManual').value = '';  
        }  
  
        function adicionarSinalComOrdenacao(hora, minuto, nivelAdicao) {  
            let idUnico = Date.now() + Math.random();  
              
            sinaisNaPlanilha.push({  
                id: idUnico,  
                hora: hora,  
                minuto: minuto,  
                nivel: nivelAdicao,  
                status: 'PENDENTE'  
            });  
  
            sinaisNaPlanilha.sort((a, b) => (a.hora * 60 + a.minuto) - (b.hora * 60 + b.minuto));  
            salvarDados();  
            renderSinais();  
        }  
  
        function validarSinalIndividual(id, tipo) {  
            let index = sinaisNaPlanilha.findIndex(s => s.id === id);  
            if (index === -1) return;  
  
            if (tipo === 'GREEN') {  
                sinaisNaPlanilha[index].status = 'GREEN';  
            } else if (tipo === 'RED') {  
                sinaisNaPlanilha[index].status = 'RED';  
                let sinalAtual = sinaisNaPlanilha[index];  
  
                if (sinalAtual.nivel < 2) {  
                    let novoNivel = sinalAtual.nivel + 1;  
                    let novoMinuto = sinalAtual.minuto + 10;  
                    let novaHora = sinalAtual.hora;  
  
                    if (novoMinuto >= 60) {  
                        novoMinuto = novoMinuto % 60;  
                        novaHora = (novaHora + 1) % 24;  
                    }  
                    adicionarSinalComOrdenacao(novaHora, novoMinuto, novoNivel);  
                } else {  
                    alert('Limite de proteção atingido!');  
                }  
            }  
            salvarDados();  
            renderSinais();  
        }  
  
        function renderSinais() {  
            const container = document.getElementById('listaSinais');  
            if (sinaisNaPlanilha.length === 0) {  
                container.innerHTML = `<div class="text-gray-600 text-sm italic text-center py-8">Nenhum sinal calculado ainda...</div>`;  
                return;  
            }  
  
            let agora = new Date();  
            let horaAtual = agora.getHours();  
            let minAtual = agora.getMinutes();  
  
            container.innerHTML = sinaisNaPlanilha.map(sinal => {  
                const hFormatada = sinal.hora < 10 ? '0' + sinal.hora : sinal.hora;  
                const mFormatada = sinal.minuto < 10 ? '0' + sinal.minuto : sinal.minuto;  
                const horarioTexto = `${hFormatada}:${mFormatada}`;  
  
                // Cálculo de distância temporal para o Alerta de proximidade (Regra 3)  
                let tempoSinalEmMinutos = sinal.hora * 60 + sinal.minuto;  
                let tempoAtualEmMinutos = horaAtual * 60 + minAtual;  
                let diferenca = tempoSinalEmMinutos - tempoAtualEmMinutos;  
  
                // Estilos base de status fixo  
                let bgStatusClass = 'bg-graphite-dark border-zinc-800';  
                let textoHoraClass = 'text-white';  
  
                if (sinal.status === 'GREEN') {  
                    bgStatusClass = 'bg-emerald-950 bg-opacity-40 border-emerald-500';  
                    textoHoraClass = 'text-emerald-400 font-bold';  
                } else if (sinal.status === 'RED') {  
                    bgStatusClass = 'bg-rose-950 bg-opacity-20 border-rose-950 opacity-40';  
                    textoHoraClass = 'text-rose-500';  
                } else if (sinal.status === 'PENDENTE') {  
                    // 3. Sistema dinâmico de Alertas no minuto (Círculos coloridos / bordas piscantes)  
                    if (diferenca === 1) {  
                        bgStatusClass = 'bg-zinc-900 border-amber-500 ring-2 ring-amber-500 ring-opacity-50';  
                        textoHoraClass = 'text-amber-400';  
                    } else if (diferenca === 0) {  
                        bgStatusClass = 'bg-zinc-900 border-emerald-500 ring-2 ring-emerald-500 ring-opacity-70 animate-pulse';  
                        textoHoraClass = 'text-emerald-400 font-bold';  
                    } else if (diferenca === -1) {  
                        bgStatusClass = 'bg-zinc-900 border-amber-500';  
                        textoHoraClass = 'text-amber-400';  
                    }  
                }  
  
                let tagNivel = '';  
                if (sinal.nivel === 1) tagNivel = `<span class="text-[9px] bg-zinc-900 text-zinc-400 px-1.5 py-0.5 rounded border border-zinc-700 ml-2">Adição 1</span>`;  
                if (sinal.nivel === 2) tagNivel = `<span class="text-[9px] bg-red-950 bg-opacity-30 text-neon-red px-1.5 py-0.5 rounded border border-red-900 ml-2">Adição 2 Max</span>`;  
  
                const desativarRed = sinal.nivel >= 2 ? 'disabled opacity-20 cursor-not-allowed' : '';  
  
                return `  
                    <div class="flex items-center justify-between p-2 rounded-lg border ${bgStatusClass} transition duration-150">  
                        <div class="flex items-center">  
                            <div class="w-2.5 h-2.5 rounded-full mr-2 ${diferenca === 0 && sinal.status === 'PENDENTE' ? 'bg-emerald-400' : (Math.abs(diferenca) === 1 && sinal.status === 'PENDENTE' ? 'bg-amber-400' : 'bg-transparent')}"></div>  
                            <span class="font-bold tracking-wider text-base ${textoHoraClass}">${horarioTexto}</span>  
                            ${tagNivel}  
                        </div>  
                        <div class="flex gap-2">  
                            <button onclick="validarSinalIndividual(${sinal.id}, 'GREEN')" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-[10px] px-3 py-1 rounded transition uppercase">  
                                GREEN  
                            </button>  
                            <button onclick="validarSinalIndividual(${sinal.id}, 'RED')" ${desativarRed} class="bg-rose-600 hover:bg-rose-500 text-white font-bold text-[10px] px-3 py-1 rounded transition uppercase">  
                                RED  
                            </button>  
                        </div>  
                    </div>  
                `;  
            }).join('');  
        }  
  
        // --- LÓGICA DE PUXADORES MANUAIS ---  
        function registrarPuxadorManual() {  
            const inputNum = document.getElementById('inputPuxadorManual');  
            const inputMin = document.getElementById('minPuxadorManual');  
  
            if (inputNum.value === '') {  
                alert('Digite o número do puxador.');  
                return;  
            }  
  
            historicoPuxadores.push({  
                numero: parseInt(inputNum.value),  
                minuto: inputMin.value !== '' ? parseInt(inputMin.value) : new Date().getMinutes(),  
                timestamp: Date.now()  
            });  
  
            salvarDados();  
            renderPuxadores();  
  
            inputNum.value = '';  
            inputMin.value = '';  
        }  
  
        function renderPuxadores() {  
            const container = document.getElementById('containerPuxadores');  
              
            // Contagem de recorrência dos números ativos  
            let contagem = {};  
            historicoPuxadores.forEach(p => {  
                contagem[p.numero] = (contagem[p.numero] || 0) + 1;  
            });  
  
            let html = '';  
            // 4. Mudar puxadores para formato Círculo com cores baseadas no número  
            Object.keys(contagem).forEach(num => {  
                let n = parseInt(num);  
                if (contagem[n] >= 3) {  
                    // Regra: <= 7 Vermelho | de 8 a 14 Preta  
                    let bgFundoBolinha = n <= 7 ? 'bg-red-600 border-red-500' : 'bg-zinc-950 border-zinc-800 text-white';  
                    let corTextoQuantidade = n <= 7 ? 'text-white bg-black' : 'text-red-400 bg-red-950';  
  
                    html += `  
                        <div class="w-24 h-24 rounded-full ${bgFundoBolinha} border-2 flex flex-col justify-center items-center neon-glow select-none relative">  
                            <span class="text-[10px] opacity-60 uppercase tracking-widest block font-semibold">Nº</span>  
                            <span class="text-2xl font-black">${n}</span>  
                            <span class="absolute -bottom-1 text-[9px] ${corTextoQuantidade} px-2 py-0.5 rounded-full font-bold border border-opacity-30 border-white">${contagem[n]}x</span>  
                        </div>  
                    `;  
                }  
            });  
  
            if (html === '') {  
                container.innerHTML = `<div class="col-span-full text-gray-600 text-sm italic text-center py-4 w-full">Nenhum puxador atingiu mais de 2 repetições nas últimas 3 horas.</div>`;  
            } else {  
                container.innerHTML = html;  
            }  
        }  
  
        // 6. Manter os dados gravados ao atualizar e botão Reset Geral  
        function salvarDados() {  
            localStorage.setItem('sinaisNaPlanilha', JSON.stringify(sinaisNaPlanilha));  
            localStorage.setItem('historicoPuxadores', JSON.stringify(historicoPuxadores));  
            localStorage.setItem('ultimaHoraRegistrada', ultimaHoraRegistrada);  
        }  
  
        function resetGeral() {  
            if (confirm('Deseja apagar completamente a memória do painel? Isso limpará todos os sinais e puxadores.')) {  
                localStorage.clear();  
                sinaisNaPlanilha = [];  
                historicoPuxadores = [];  
                ultimaHoraRegistrada = new Date().getHours();  
                renderSinais();  
                renderPuxadores();  
            }  
        }  
    </script>  
</body>  
</html>
